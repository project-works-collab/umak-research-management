; Run stunnel alongside clamd on the dedicated private scanner host.
; Do not expose the raw clamd TCP port outside this host.
foreground = yes
sslVersionMin = TLSv1.3
cert = /etc/crm/scanner/server.crt
key = /etc/crm/scanner/server.key
CAfile = /etc/crm/scanner/client-ca.crt
verifyChain = yes
requireCert = yes

[clamav]
accept = 0.0.0.0:3311
connect = 127.0.0.1:3310
