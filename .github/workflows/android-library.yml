name: android-library
on:
  push:
    paths: ['android/**', '.github/workflows/android-library.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android-library.yml']
permissions:
  contents: read
jobs:
  android-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - run: android/gradlew -p android :app:assembleDebug :core:assembleDebug :core:assembleDebugAndroidTest :app:lintDebug :core:lintDebug --no-daemon
